<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">Learning-rate schedule used to train YOLO-v3</title>
  <desc id="d">Log-scale learning rate over 11,000 iterations: a 500-iteration warm-up that rises as the fourth power of progress to 0.0001, constant 0.0001 until iteration 6,800, then 0.00001 until iteration 9,950, then 0.000001 to the end.</desc>
  <style>
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e2e8f0}
    .h{font-size:20px;font-weight:600}
    .s{font-size:13px;fill:#94a3b8}
    .a{font-size:12px;fill:#94a3b8}
    .l{font-size:12px;fill:#cbd5e1}
    .g{stroke:#1e293b;stroke-width:1}
    .ax{stroke:#475569;stroke-width:1.2}
  </style>
  <rect width="960" height="380" rx="16" fill="#0f172a"/>
  <text x="28" y="40" class="h">Learning-rate schedule (detection/train_yolov3.m)</text>
  <text x="28" y="62" class="s">thesis settings: 11,000 iterations · base rate 0.0001 · 500-iteration warm-up · step decay ×0.1 at 60% and 90%</text>

  <!-- grid -->
  <g class="g">
    <line x1="90" y1="90" x2="900" y2="90"/><line x1="90" y1="160" x2="900" y2="160"/><line x1="90" y1="230" x2="900" y2="230"/>
    <line x1="237.3" y1="90" x2="237.3" y2="300"/><line x1="384.5" y1="90" x2="384.5" y2="300"/><line x1="531.8" y1="90" x2="531.8" y2="300"/>
    <line x1="679.1" y1="90" x2="679.1" y2="300"/><line x1="826.4" y1="90" x2="826.4" y2="300"/>
  </g>
  <line x1="90" y1="300" x2="900" y2="300" class="ax"/><line x1="90" y1="86" x2="90" y2="300" class="ax"/>
  <g class="a" text-anchor="end">
    <text x="82" y="94">10⁻⁴</text><text x="82" y="164">10⁻⁵</text><text x="82" y="234">10⁻⁶</text><text x="82" y="304">10⁻⁷</text>
  </g>
  <g class="a" text-anchor="middle">
    <text x="90" y="320">0</text><text x="237.3" y="320">2,000</text><text x="384.5" y="320">4,000</text><text x="531.8" y="320">6,000</text>
    <text x="679.1" y="320">8,000</text><text x="826.4" y="320">10,000</text>
  </g>
  <text x="495" y="344" class="a" text-anchor="middle">iteration</text>

  <!-- warm-up shading -->
  <rect x="90" y="90" width="36.8" height="210" fill="#22d3ee" fill-opacity=".10"/>
  <path d="M96.6 299.9 L97.3 286.9 L98.0 275.2 L98.8 264.6 L99.5 254.7 L100.2 245.7 L101.0 237.2 L101.7 229.3 L102.4 221.9 L103.2 214.9 L103.9 208.3 L104.7 202.0 L105.4 196.1 L106.1 190.4 L106.9 185.0 L107.6 179.8 L108.3 174.8 L109.1 170.0 L109.8 165.4 L110.5 160.9 L111.3 156.7 L112.0 152.5 L112.8 148.5 L113.5 144.7 L114.2 140.9 L115.0 137.3 L115.7 133.7 L116.4 130.3 L117.2 126.9 L117.9 123.7 L118.6 120.5 L119.4 117.4 L120.1 114.4 L120.9 111.5 L121.6 108.6 L122.3 105.8 L123.1 103.1 L123.8 100.4 L124.5 97.8 L125.3 95.2 L126.0 92.7 L126.7 90.2 L126.8 90.0 L590.7 90.0 L590.7 160.0 L822.7 160.0 L822.7 230.0 L900.0 230.0" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- annotations -->
  <text x="136" y="122" class="l">warm-up: 1–500</text>
  <text x="136" y="138" class="a">rate × (iteration / 500)⁴</text>
  <text x="340" y="82" class="l" text-anchor="middle">0.0001 until 6,800</text>
  <text x="706" y="152" class="l" text-anchor="middle">0.00001 until 9,950</text>
  <text x="861" y="222" class="l" text-anchor="middle">0.000001</text>
</svg>
