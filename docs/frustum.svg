<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Camera-to-LiDAR frustum projection</title>
  <desc id="d">A 2D YOLO box in the left image is cast from the camera center through the box corners into 3D, forming a frustum. The camera-to-LiDAR rigid transform places the frustum in the LiDAR point cloud. Points inside the frustum are clustered with a 0.11 m distance threshold, a cuboid is fitted, and its center becomes the LiDAR position measurement.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e2e8f0}
      .h{font-size:20px;font-weight:600}
      .s{font-size:13px;fill:#94a3b8}
      .b{font-size:14px;font-weight:600}
      .l{font-size:12px;fill:#cbd5e1}
      .m{font-size:11.5px;fill:#94a3b8;font-family:ui-monospace,Consolas,monospace}
      .n{font-size:12px;font-weight:700;fill:#0f172a}
      .ray{stroke:#22d3ee;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
      .pt{fill:#64748b}
      .in{fill:#a78bfa}
    </style>
  </defs>
  <rect width="960" height="400" rx="16" fill="#0f172a"/>
  <text x="28" y="40" class="h">From a 2D box to a 3D LiDAR measurement</text>
  <text x="28" y="62" class="s">fusion/realtime_fusion.m calls bboxCameraToLidar(bboxes_left, pointCloud, intrinsics, cam2lidar, 'ClusterThreshold', 0.11)</text>

  <!-- camera -->
  <rect x="40" y="196" width="34" height="24" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M74 202l12-6v24l-12-6z" fill="#22d3ee"/>
  <text x="28" y="246" class="l">left camera</text>

  <!-- image plane -->
  <path d="M150 138L196 118V298L150 318Z" fill="#1e293b" stroke="#475569"/>
  <path d="M160 190L184 180V226L160 236Z" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="128" y="342" class="l">image + YOLO box</text>

  <!-- frustum -->
  <path d="M86 208L560 96V330Z" fill="#22d3ee" fill-opacity=".05"/>
  <path class="ray" d="M86 208L560 96"/>
  <path class="ray" d="M86 208L560 330"/>
  <path class="ray" d="M86 208L540 150"/>
  <path class="ray" d="M86 208L540 290"/>
  <path d="M560 96V330" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- point cloud: background -->
  <g class="pt">
    <circle cx="260" cy="110" r="2"/><circle cx="300" cy="350" r="2"/><circle cx="350" cy="96" r="2"/><circle cx="420" cy="360" r="2"/>
    <circle cx="610" cy="120" r="2"/><circle cx="630" cy="300" r="2"/><circle cx="600" cy="220" r="2"/><circle cx="640" cy="180" r="2"/>
    <circle cx="590" cy="350" r="2"/><circle cx="520" cy="370" r="2"/><circle cx="470" cy="84" r="2"/><circle cx="380" cy="80" r="2"/>
    <circle cx="246" cy="300" r="2"/><circle cx="660" cy="250" r="2"/><circle cx="560" cy="76" r="2"/>
  </g>
  <!-- point cloud: inside frustum (object) -->
  <g class="in">
    <circle cx="410" cy="190" r="2.4"/><circle cx="422" cy="182" r="2.4"/><circle cx="436" cy="188" r="2.4"/><circle cx="448" cy="196" r="2.4"/>
    <circle cx="414" cy="206" r="2.4"/><circle cx="428" cy="214" r="2.4"/><circle cx="442" cy="208" r="2.4"/><circle cx="452" cy="218" r="2.4"/>
    <circle cx="418" cy="228" r="2.4"/><circle cx="432" cy="236" r="2.4"/><circle cx="446" cy="232" r="2.4"/><circle cx="458" cy="240" r="2.4"/>
    <circle cx="424" cy="246" r="2.4"/><circle cx="440" cy="252" r="2.4"/><circle cx="454" cy="198" r="2.4"/>
  </g>
  <!-- cuboid -->
  <path d="M402 178H458L470 170H414Z M402 178V256H458V178 M458 256L470 248V170" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
  <circle cx="436" cy="216" r="4.5" fill="#fbbf24"/>
  <text x="478" y="214" class="b">cuboid center</text>
  <text x="478" y="232" class="m">= LiDAR xyz</text>

  <!-- transform tag -->
  <rect x="236" y="148" width="132" height="26" rx="13" fill="#3b0764" stroke="#a78bfa"/>
  <text x="302" y="166" class="l" text-anchor="middle">cam2lidar (rigid 3D)</text>

  <!-- steps -->
  <g>
    <circle cx="712" cy="112" r="12" fill="#34d399"/><text x="712" y="116" class="n" text-anchor="middle">1</text>
    <text x="734" y="110" class="b">Detect</text>
    <text x="734" y="128" class="l">YOLO-v3 box in the left image</text>
    <circle cx="712" cy="172" r="12" fill="#22d3ee"/><text x="712" y="176" class="n" text-anchor="middle">2</text>
    <text x="734" y="170" class="b">Cast a frustum</text>
    <text x="734" y="188" class="l">rays through the box corners</text>
    <circle cx="712" cy="232" r="12" fill="#a78bfa"/><text x="712" y="236" class="n" text-anchor="middle">3</text>
    <text x="734" y="230" class="b">Move into the LiDAR frame</text>
    <text x="734" y="248" class="l">extrinsic calibration transform</text>
    <circle cx="712" cy="292" r="12" fill="#fbbf24"/><text x="712" y="296" class="n" text-anchor="middle">4</text>
    <text x="734" y="290" class="b">Cluster and fit</text>
    <text x="734" y="308" class="l">points inside, 0.11 m threshold</text>
  </g>
  <text x="28" y="384" class="s">No second neural network runs on the point cloud: the camera label selects the LiDAR points.</text>
</svg>
